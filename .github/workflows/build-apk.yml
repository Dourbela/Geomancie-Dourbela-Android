name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Extraire le ZIP
        run: unzip -o Geomancie_Dourbela_Android_GitHub_APK.zip

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler APK
        run: gradle -p GeomancieDourbelaAndroid assembleDebug

      - name: Récupérer APK
        uses: actions/upload-artifact@v4
        with:
          name: Geomancie-Dourbela-APK
          path: GeomancieDourbelaAndroid/app/build/outputs/apk/debug/app-debug.apk
